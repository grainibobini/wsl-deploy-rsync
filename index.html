<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Бегающие котята</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #2e5f4b 0%, #1d3e31 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
        }

        .game-container {
            background: #d9b382;
            padding: 20px;
            border-radius: 48px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            background-color: #f8e4c9;
        }

        .info {
            text-align: center;
            margin-top: 18px;
            color: #f9efcf;
            text-shadow: 2px 2px 0 #5a3e1b;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .info span {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        button {
            background: #ffcf7a;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 40px;
            margin-left: 15px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            box-shadow: 0 3px 0 #a4652b;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #a4652b;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="catCanvas" width="1000" height="550" style="width:1000px; height:550px"></canvas>
        <div class="info">
            <span>🐾 Котят: <span id="catCount">3</span></span>
            <span>🧶 По комнате</span>
            <button id="addCatBtn">+ Добавить котёнка</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ------ НАСТРОЙКИ ------
        const canvas = document.getElementById('catCanvas');
        const ctx = canvas.getContext('2d');
        
        // Размеры комнаты (границы, с учётом отступов от краёв)
        const bounds = {
            left: 40,
            right: canvas.width - 40,
            top: 50,
            bottom: canvas.height - 50
        };

        // Массив котят
        let kittens = [];
        
        // Вспомогательные функции
        function random(min, max) {
            return min + Math.random() * (max - min);
        }

        // ------------------- КЛАСС КОТЁНКА -------------------
        class Kitten {
            constructor(x, y, colorVariant = null) {
                this.x = x;
                this.y = y;
                // случайная скорость 0.5 .. 2.2 пикселя за кадр (плавно)
                this.vx = random(-1.8, 1.8);
                this.vy = random(-1.8, 1.8);
                // если скорость почти ноль — докрутим
                if (Math.abs(this.vx) < 0.5) this.vx += (Math.random() - 0.5) * 1.2;
                if (Math.abs(this.vy) < 0.5) this.vy += (Math.random() - 0.5) * 1.2;
                
                // размер котёнка (тело ~ 28px)
                this.size = 28;
                this.earSize = 14;
                
                // цвет шерсти (рыжий, серый, чёрный, бежевый)
                const variants = [
                    '#E67E22', // рыжий
                    '#7F8C8D', // серый
                    '#3E2723', // тёмно-коричневый
                    '#F5CBA7', // светлый
                    '#C4450C'  // оранжевый
                ];
                if(colorVariant !== null) {
                    this.furColor = variants[colorVariant % variants.length];
                } else {
                    this.furColor = variants[Math.floor(Math.random() * variants.length)];
                }
                
                // цвет глаз
                this.eyeColor = '#2C3E50';
                // усталость/игривость (для анимации моргания)
                this.blinkTimer = Math.random() * 100;
                this.tailAngle = 0;
                this.tailDirection = 1;
            }
            
            // обновление позиции и поведения
            update() {
                // движение
                this.x += this.vx;
                this.y += this.vy;
                
                // отскок от границ + небольшой случайный "поворот" при столкновении, чтобы котята не застревали
                if (this.x - this.size/2 < bounds.left) {
                    this.x = bounds.left + this.size/2;
                    this.vx = Math.abs(this.vx) * 0.9 + random(0.3, 0.9);
                    this.vy += random(-0.4, 0.4);
                }
                if (this.x + this.size/2 > bounds.right) {
                    this.x = bounds.right - this.size/2;
                    this.vx = -Math.abs(this.vx) * 0.9 - random(0.2, 0.7);
                    this.vy += random(-0.4, 0.4);
                }
                if (this.y - this.size/2 < bounds.top) {
                    this.y = bounds.top + this.size/2;
                    this.vy = Math.abs(this.vy) * 0.9 + random(0.3, 0.9);
                    this.vx += random(-0.4, 0.4);
                }
                if (this.y + this.size/2 > bounds.bottom) {
                    this.y = bounds.bottom - this.size/2;
                    this.vy = -Math.abs(this.vy) * 0.9 - random(0.2, 0.7);
                    this.vx += random(-0.4, 0.4);
                }
                
                // ограничение максимальной скорости (чтобы не убежали)
                let maxSpeed = 2.9;
                if (Math.abs(this.vx) > maxSpeed) this.vx = this.vx > 0 ? maxSpeed : -maxSpeed;
                if (Math.abs(this.vy) > maxSpeed) this.vy = this.vy > 0 ? maxSpeed : -maxSpeed;
                
                // небольшая "охота" за случайным изменением курса (игривость)
                if (Math.random() < 0.02) {
                    this.vx += random(-0.6, 0.6);
                    this.vy += random(-0.6, 0.6);
                }
                
                // анимация хвоста (плавное виляние)
                this.tailAngle += 0.07 * this.tailDirection;
                if (this.tailAngle > 0.8) this.tailDirection = -1;
                if (this.tailAngle < -0.6) this.tailDirection = 1;
                
                // моргание
                this.blinkTimer++;
            }
            
            // рисуем котёнка (векторный арт)
            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 0; // для чёткости
                // для поворота в сторону движения? можно слегка наклонять, но не обязательно
                const direction = this.vx > 0 ? 1 : -1;
                // тело (овал)
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size*0.85, this.size*0.75, 0, 0, Math.PI*2);
                ctx.fillStyle = this.furColor;
                ctx.fill();
                ctx.strokeStyle = '#5D3A1A';
                ctx.lineWidth = 1.2;
                ctx.stroke();
                
                // уши (треугольники)
                ctx.fillStyle = this.furColor;
                // левое ухо
                ctx.beginPath();
                ctx.moveTo(this.x - this.size*0.65, this.y - this.size*0.55);
                ctx.lineTo(this.x - this.size*0.25, this.y - this.size*0.85);
                ctx.lineTo(this.x - this.size*0.1, this.y - this.size*0.55);
                ctx.fill();
                ctx.stroke();
                // правое ухо
                ctx.beginPath();
                ctx.moveTo(this.x + this.size*0.65, this.y - this.size*0.55);
                ctx.lineTo(this.x + this.size*0.25, this.y - this.size*0.85);
                ctx.lineTo(this.x + this.size*0.1, this.y - this.size*0.55);
                ctx.fill();
                ctx.stroke();
                
                // внутренняя часть ушей (розовая)
                ctx.fillStyle = '#FBC5B5';
                ctx.beginPath();
                ctx.moveTo(this.x - this.size*0.55, this.y - this.size*0.65);
                ctx.lineTo(this.x - this.size*0.3, this.y - this.size*0.78);
                ctx.lineTo(this.x - this.size*0.2, this.y - this.size*0.62);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(this.x + this.size*0.55, this.y - this.size*0.65);
                ctx.lineTo(this.x + this.size*0.3, this.y - this.size*0.78);
                ctx.lineTo(this.x + this.size*0.2, this.y - this.size*0.62);
                ctx.fill();
                
                // глаза (с учётом моргания)
                let eyeOpen = true;
                if (this.blinkTimer % 80 < 4) eyeOpen = false; // моргание каждые ~80 кадров
                
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.ellipse(this.x - this.size*0.35, this.y - this.size*0.1, 5, eyeOpen ? 6 : 1.5, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x + this.size*0.35, this.y - this.size*0.1, 5, eyeOpen ? 6 : 1.5, 0, 0, Math.PI*2);
                ctx.fill();
                
                // зрачки (смотрят в сторону движения)
                ctx.fillStyle = this.eyeColor;
                let pupilShiftX = Math.min(Math.max(this.vx * 1.2, -3), 3);
                let pupilShiftY = Math.min(Math.max(this.vy * 0.8, -2), 2);
                ctx.beginPath();
                ctx.arc(this.x - this.size*0.35 + pupilShiftX*0.7, this.y - this.size*0.1 + pupilShiftY, 2.8, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + this.size*0.35 + pupilShiftX*0.7, this.y - this.size*0.1 + pupilShiftY, 2.8, 0, Math.PI*2);
                ctx.fill();
                // блики
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - this.size*0.4, this.y - this.size*0.15, 1.2, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + this.size*0.3, this.y - this.size*0.15, 1.2, 0, Math.PI*2);
                ctx.fill();
                
                // носик (розовый треугольник)
                ctx.fillStyle = '#FF9AA2';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + 5);
                ctx.lineTo(this.x - 3, this.y + 10);
                ctx.lineTo(this.x + 3, this.y + 10);
                ctx.fill();
                // усики (по 2 линии)
                ctx.beginPath();
                ctx.strokeStyle = '#5A3E2B';
                ctx.lineWidth = 1;
                ctx.moveTo(this.x - 12, this.y + 2);
                ctx.lineTo(this.x - 25, this.y - 2);
                ctx.moveTo(this.x - 12, this.y + 6);
                ctx.lineTo(this.x - 27, this.y + 8);
                ctx.moveTo(this.x + 12, this.y + 2);
                ctx.lineTo(this.x + 25, this.y - 2);
                ctx.moveTo(this.x + 12, this.y + 6);
                ctx.lineTo(this.x + 27, this.y + 8);
                ctx.stroke();
                
                // хвост (виляющий)
                ctx.beginPath();
                ctx.strokeStyle = this.furColor;
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                let tailX = this.x - this.size*0.9;
                let tailY = this.y + this.size*0.3;
                let angle = this.tailAngle;
                ctx.moveTo(tailX, tailY);
                ctx.quadraticCurveTo(tailX - 12 + angle*6, tailY + 6 + angle*4, tailX - 22 + angle*10, tailY + 2 + angle*3);
                ctx.stroke();
                
                // маленькие лапки намёком
                ctx.fillStyle = this.furColor;
                ctx.beginPath();
                ctx.ellipse(this.x - 12, this.y + 17, 5, 3, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x + 12, this.y + 17, 5, 3, 0, 0, Math.PI*2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // -------- ИНИЦИАЛИЗАЦИЯ (3 котёнка в случайных местах) --------
        function initKittens(count) {
            let newKittens = [];
            for (let i = 0; i < count; i++) {
                let x = random(bounds.left + 30, bounds.right - 30);
                let y = random(bounds.top + 30, bounds.bottom - 30);
                let kitten = new Kitten(x, y, i);
                // убедимся, что скорость не нулевая
                if (Math.abs(kitten.vx) < 0.3) kitten.vx += (Math.random() - 0.5)*0.8;
                if (Math.abs(kitten.vy) < 0.3) kitten.vy += (Math.random() - 0.5)*0.8;
                newKittens.push(kitten);
            }
            return newKittens;
        }
        
        // -------- ОТРИСОВКА КОМНАТЫ (коврик, игрушки, фон) --------
        function drawRoom() {
            // пол (деревянный тёплый)
            ctx.fillStyle = '#E7C9A3';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // текстура досок
            ctx.strokeStyle = '#C2A070';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 45) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            // коврик с бахромой
            ctx.fillStyle = '#CD9A5B';
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.fillRect(bounds.left-12, bounds.bottom-70, bounds.right-bounds.left+24, 60);
            ctx.fillStyle = '#B87C4A';
            ctx.fillRect(bounds.left-8, bounds.bottom-67, bounds.right-bounds.left+16, 55);
            ctx.fillStyle = '#E1B282';
            for(let i=0;i<12;i++) {
                ctx.fillRect(bounds.left-4 + i*((bounds.right-bounds.left+8)/12), bounds.bottom-12, 6, 12);
            }
            ctx.shadowBlur = 0;
            
            // окно с видом
            ctx.fillStyle = '#AAD0E6';
            ctx.fillRect(50, 30, 130, 100);
            ctx.fillStyle = '#F9E7C2';
            ctx.fillRect(55, 35, 120, 90);
            ctx.fillStyle = '#7D5E3A';
            ctx.fillRect(108, 35, 14, 90);
            ctx.fillRect(55, 75, 120, 10);
            // облачко за окном
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(90, 55, 15, 12, 0, 0, Math.PI*2);
            ctx.ellipse(110, 50, 18, 14, 0, 0, Math.PI*2);
            ctx.ellipse(130, 55, 13, 11, 0, 0, Math.PI*2);
            ctx.fill();
            
            // клубки ниток (декоративные статичные, но милые)
            ctx.fillStyle = '#D2691E';
            ctx.beginPath();
            ctx.arc(800, 480, 15, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#F4A460';
            ctx.beginPath();
            ctx.arc(805, 475, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(880, 500, 12, 0, Math.PI*2);
            ctx.fill();
        }
        
        // -------- АНИМАЦИОННЫЙ ЦИКЛ --------
        function animate() {
            // обновляем позиции котят
            for (let kitten of kittens) {
                kitten.update();
            }
            
            // отрисовка
            drawRoom();
            for (let kitten of kittens) {
                kitten.draw(ctx);
            }
            
            // обновление счётчика в интерфейсе
            document.getElementById('catCount').innerText = kittens.length;
            
            requestAnimationFrame(animate);
        }
        
        // -------- ДОБАВЛЕНИЕ КОТЁНКА (по клику на кнопку) --------
        function addKitten() {
            if (kittens.length < 12) {
                let x = random(bounds.left + 40, bounds.right - 40);
                let y = random(bounds.top + 40, bounds.bottom - 40);
                let newCat = new Kitten(x, y, kittens.length);
                kittens.push(newCat);
            } else {
                // визуальный фидбек
                const btn = document.getElementById('addCatBtn');
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => btn.style.transform = '', 150);
            }
        }
        
        // Запуск и старт
        kittens = initKittens(3);
        // Добавим обработчик на кнопку
        document.getElementById('addCatBtn').addEventListener('click', addKitten);
        
        // Запускаем анимацию
        animate();
        
        // Доп. приятность: при клике по комнате все котята немного меняют направление (игра)
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
            for (let kitten of kittens) {
                // испуганно отпрыгивают от клика
                const dx = kitten.x - mouseX;
                const dy = kitten.y - mouseY;
                const dist = Math.hypot(dx, dy);
                if (dist < 70 && dist > 0.1) {
                    kitten.vx += (dx / dist) * 1.2;
                    kitten.vy += (dy / dist) * 1.2;
                } else if (dist < 150) {
                    kitten.vx += (dx / (dist+0.1)) * 0.6;
                    kitten.vy += (dy / (dist+0.1)) * 0.6;
                }
                // ограничим максимум
                let maxSp = 3.2;
                if(Math.abs(kitten.vx) > maxSp) kitten.vx = kitten.vx>0? maxSp: -maxSp;
                if(Math.abs(kitten.vy) > maxSp) kitten.vy = kitten.vy>0? maxSp: -maxSp;
            }
        });
    })();
</script>
</body>
</html>
