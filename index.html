<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Играющие котята</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            font-family: sans-serif;
        }

        /* Комната: пол */
        .room {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Котята */
        .cat {
            position: absolute;
            width: 60px;
            height: 60px;
            font-size: 50px;
            user-select: none;
            animation: runAndPlay 8s infinite ease-in-out;
        }

        .cat::before {
            content: '🐱';
        }

        /* Разные цвета клубков и траектории для котят */
        .cat1 {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .cat2 {
            bottom: 20%;
            right: 10%;
            animation-delay: -3s; /* Чтобы двигались не одновременно */
            transform: scaleX(-1); /* Смотрит в другую сторону */
        }

        /* Клубки ниток */
        .yarn {
            position: absolute;
            width: 30px;
            height: 30px;
            font-size: 25px;
            animation: rollYarn 4s infinite linear;
        }

        .yarn::before {
            content: '🧶';
        }

        .yarn1 {
            top: 40%;
            left: 30%;
            animation-delay: -1s;
        }

        .yarn2 {
            bottom: 30%;
            right: 40%;
            animation-delay: -2.5s;
        }

        /* Анимация движения котят */
        @keyframes runAndPlay {
            0% { top: 20%; left: 10%; transform: rotate(0deg); }
            20% { top: 60%; left: 30%; transform: rotate(15deg); }
            40% { top: 70%; left: 70%; transform: rotate(0deg) scaleX(-1); }
            60% { top: 30%; left: 80%; transform: rotate(-15deg) scaleX(-1); }
            80% { top: 15%; left: 50%; transform: rotate(5deg); }
            100% { top: 20%; left: 10%; transform: rotate(0deg); }
        }

        /* Анимация перекатывания клубков */
        @keyframes rollYarn {
            0% { transform: rotate(0deg) translate(0, 0); }
            50% { transform: rotate(360deg) translate(20px, -10px); }
            100% { transform: rotate(720deg) translate(0, 0); }
        }

        /* Декор комнаты (коврик) */
        .rug {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 150px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 75px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

<div class="room">
    <!-- Коврик -->
    <div class="rug"></div>

    <!-- Котята -->
    <div class="cat cat1"></div>
    <div class="cat cat2"></div>

    <!-- Клубки ниток -->
    <div class="yarn yarn1"></div>
    <div class="yarn yarn2"></div>
</div>

</body>
</html>
