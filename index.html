<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Элитная симуляция котят | Professional cat simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1e3c2c, #0f281c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Montserrat', sans-serif;
            padding: 20px;
        }

        .sim-container {
            background: #d9ae6c;
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255, 255, 255, 0.4);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: crosshair;
            background: #f6eedf;
        }

        .dashboard {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 60px;
            color: #fffaec;
            font-weight: bold;
        }

        .stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .stat {
            background: #2d2b1f80;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        button {
            background: #ffcd7e;
            border: none;
            font-family: inherit;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.1s linear;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 #9b6a2c;
            color: #2c2416;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9b6a2c;
        }

        .badge {
            display: inline-block;
            background: #f0b27a;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #262216;
        }
    </style>
</head>
<body>
<div>
    <div class="sim-container">
        <canvas id="catCanvas" width="1200" height="650" style="width:1200px; height:650px"></canvas>
        <div class="dashboard">
            <div class="stats">
                <div class="stat">🐱 Котят: <span id="catCount">0</span></div>
                <div class="stat">🧶 Клубков: <span id="yarnCount">3</span></div>
                <div class="stat">⚡ Активность: <span id="activityLevel">92%</span></div>
            </div>
            <div class="badge">⭐ ПРОФИ | Продвинутое поведение</div>
            <button id="spawnCatBtn">+ Новый котёнок</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- ИНЖИНИРИНГ СИМУЛЯЦИИ ----------
        const canvas = document.getElementById('catCanvas');
        const ctx = canvas.getContext('2d');

        // Размеры "комнаты" (границы с отступами для красоты)
        const room = {
            left: 60,
            right: canvas.width - 60,
            top: 65,
            bottom: canvas.height - 65
        };

        // Глобальные объекты
        let cats = [];
        let yarnBalls = [];
        let mouseX = room.left + 200, mouseY = room.top + 200;   // виртуальный курсор для слежения зрачков
        let frames = 0;

        // ---- Вспомогательные функции ----
        function random(min, max) {
            return min + Math.random() * (max - min);
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        // Расстояние между точками
        function distance(x1, y1, x2, y2) {
            const dx = x1 - x2, dy = y1 - y2;
            return Math.hypot(dx, dy);
        }

        // ---- Класс Клубка ниток (интерактивный, кошки могут его катать) ----
        class YarnBall {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = random(-0.6, 0.6);
                this.vy = random(-0.6, 0.6);
                this.radius = 12;
                this.color = `hsl(${random(20, 40)}, 70%, 55%)`;
                this.beingPlayed = false;
            }

            update() {
                // простое трение
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.x += this.vx;
                this.y += this.vy;

                // отскок от стен комнаты
                if (this.x - this.radius < room.left) {
                    this.x = room.left + this.radius;
                    this.vx = Math.abs(this.vx) * 0.8;
                }
                if (this.x + this.radius > room.right) {
                    this.x = room.right - this.radius;
                    this.vx = -Math.abs(this.vx) * 0.8;
                }
                if (this.y - this.radius < room.top) {
                    this.y = room.top + this.radius;
                    this.vy = Math.abs(this.vy) * 0.8;
                }
                if (this.y + this.radius > room.bottom) {
                    this.y = room.bottom - this.radius;
                    this.vy = -Math.abs(this.vy) * 0.8;
                }
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 6;
                ctx.shadowColor = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = "#875e2c";
                ctx.lineWidth = 1.5;
                ctx.stroke();
                // текстура ниток
                ctx.beginPath();
                ctx.arc(this.x - 3, this.y - 2, 3, 0, Math.PI * 2);
                ctx.fillStyle = "#d9903a";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 4, this.y + 2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // взаимодействие с котом (кот толкает клубок)
            applyKick(kx, ky, force = 1.2) {
                const dx = this.x - kx;
                const dy = this.y - ky;
                const dist = Math.hypot(dx, dy);
                if (dist < 0.1) return;
                const angle = Math.atan2(dy, dx);
                const power = Math.min(5.5, force * 2.4 / (dist * 0.3));
                this.vx += Math.cos(angle) * power * 0.6;
                this.vy += Math.sin(angle) * power * 0.6;
                // ограничение скорости
                const maxSpeed = 6;
                if (Math.abs(this.vx) > maxSpeed) this.vx = this.vx > 0 ? maxSpeed : -maxSpeed;
                if (Math.abs(this.vy) > maxSpeed) this.vy = this.vy > 0 ? maxSpeed : -maxSpeed;
            }
        }

        // ---- Класс ПРОДВИНУТЫЙ Кот (индивидуальность, сложное поведение) ----
        class SmartCat {
            constructor(id, x, y, personality = null) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.vx = random(-1.2, 1.2);
                this.vy = random(-1.2, 1.2);
                this.size = 32;      // радиус тела
                // Характер: активность, любопытство, смелость
                if (personality) {
                    this.activity = personality.activity;
                    this.curiosity = personality.curiosity;
                    this.boldness = personality.boldness;
                } else {
                    this.activity = random(0.5, 1.5);   // влияет на скорость и частоту смены желаний
                    this.curiosity = random(0.4, 1.6);
                    this.boldness = random(0.3, 1.4);
                }
                // окрас шерсти
                this.fur = `hsl(${random(20, 45)}, ${random(55, 80)}%, ${random(45, 65)}%)`;
                this.secondFur = `hsl(${random(25, 50)}, 65%, 52%)`;
                this.eyeColor = `hsl(${random(55, 75)}, 85%, 48%)`;

                // состояние поведения
                this.state = "wander";    // wander, chase_yarn, rest, follow_mouse
                this.stateTimer = 0;
                this.targetYarn = null;
                this.restAngle = 0;
                this.tailWag = 0;
                this.blink = 0;
                this.earTwitch = 0;
                // параметры усталости (энергия)
                this.energy = random(0.6, 1.0);
                
                // анимация хвоста
                this.tailPhase = random(0, Math.PI * 2);
            }

            update(catsList, yarns, mouseScreenX, mouseScreenY) {
                // 1) Энергия медленно восстанавливается или падает в зависимости от активности
                if (this.state === "rest") this.energy += 0.003;
                else this.energy -= 0.001;
                this.energy = clamp(this.energy, 0.2, 1.0);
                
                // 2) Принятие решений (конечный автомат) с учётом характера
                this.decideState(yarns, mouseScreenX, mouseScreenY);
                
                // 3) Вычисление желаемого ускорения (steering)
                let ax = 0, ay = 0;
                const maxForce = 0.4 * this.activity;
                
                switch(this.state) {
                    case "wander":
                        // случайное блуждание с поворотом (алгоритм wander)
                        const wanderAngle = frames * 0.02 * this.activity + this.id;
                        const wanderForce = 0.25 * this.activity;
                        ax += Math.cos(wanderAngle) * wanderForce;
                        ay += Math.sin(wanderAngle) * wanderForce;
                        // иногда садится отдохнуть
                        break;
                    case "chase_yarn":
                        if (this.targetYarn && yarns.includes(this.targetYarn)) {
                            const dx = this.targetYarn.x - this.x;
                            const dy = this.targetYarn.y - this.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist > 5) {
                                const steerX = dx / dist * 0.8 * this.curiosity;
                                const steerY = dy / dist * 0.8 * this.curiosity;
                                ax += steerX;
                                ay += steerY;
                            }
                            // если подошёл близко — толкает клубок
                            if (dist < 28) {
                                this.targetYarn.applyKick(this.x, this.y, 1.4 * this.activity);
                                this.state = "wander";
                                this.stateTimer = 30;
                            }
                        } else {
                            this.state = "wander";
                        }
                        break;
                    case "follow_mouse":
                        const toMouseX = mouseScreenX - this.x;
                        const toMouseY = mouseScreenY - this.y;
                        const distToMouse = Math.hypot(toMouseX, toMouseY);
                        if (distToMouse > 15 && this.boldness > 0.4) {
                            const steerX = toMouseX / distToMouse * 0.65 * this.curiosity;
                            const steerY = toMouseY / distToMouse * 0.65 * this.curiosity;
                            ax += steerX;
                            ay += steerY;
                        }
                        if (distToMouse < 50 && Math.random() < 0.02) this.state = "wander";
                        break;
                    case "rest":
                        // сидит на месте, тормозит
                        ax = -this.vx * 0.05;
                        ay = -this.vy * 0.05;
                        break;
                }
                
                // 4) Избегание других кошек (социальная дистанция)
                for (let other of catsList) {
                    if (other === this) continue;
                    const dx = this.x - other.x;
                    const dy = this.y - other.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 45 && dist > 0.1) {
                        const avoid = 0.35 / (dist * 0.05);
                        ax += dx / dist * avoid;
                        ay += dy / dist * avoid;
                    }
                }
                
                // 5) Избегание стен (сила отталкивания)
                const margin = 25;
                if (this.x - this.size/2 < room.left + 8) ax += 0.45;
                if (this.x + this.size/2 > room.right - 8) ax -= 0.45;
                if (this.y - this.size/2 < room.top + 8) ay += 0.45;
                if (this.y + this.size/2 > room.bottom - 8) ay -= 0.45;
                
                // 6) Применение физики и скорости с ограничением
                this.vx += ax * 0.3 * this.activity;
                this.vy += ay * 0.3 * this.activity;
                const maxSpeed = 2.4 * this.activity;
                if (Math.abs(this.vx) > maxSpeed) this.vx = this.vx > 0 ? maxSpeed : -maxSpeed;
                if (Math.abs(this.vy) > maxSpeed) this.vy = this.vy > 0 ? maxSpeed : -maxSpeed;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.x += this.vx;
                this.y += this.vy;
                
                // жёсткие границы
                this.x = clamp(this.x, room.left + this.size/2, room.right - this.size/2);
                this.y = clamp(this.y, room.top + this.size/2, room.bottom - this.size/2);
                
                // анимационные счетчики
                this.tailWag = Math.sin(frames * 0.06 + this.tailPhase) * 0.8;
                this.blink = (Math.sin(frames * 0.02) > 0.95) ? 1 : 0;
                this.earTwitch = Math.sin(frames * 0.1 + this.id) * 0.3;
                
                if (this.stateTimer > 0) this.stateTimer--;
            }
            
            decideState(yarns, mouseX, mouseY) {
                // периодическая смена состояний, плюс реакция на внешние стимулы
                if (this.stateTimer <= 0 && Math.random() < 0.008 * this.activity) {
                    // шанс погнаться за ближайшим клубком
                    let closestYarn = null;
                    let minDist = Infinity;
                    for (let y of yarns) {
                        const d = distance(this.x, this.y, y.x, y.y);
                        if (d < minDist && d < 130 * this.curiosity) {
                            minDist = d;
                            closestYarn = y;
                        }
                    }
                    if (closestYarn && Math.random() < 0.45 * this.curiosity) {
                        this.state = "chase_yarn";
                        this.targetYarn = closestYarn;
                        this.stateTimer = 120;
                        return;
                    }
                    // реакция на мышь (если курсор близко и кот смелый)
                    const distMouse = distance(this.x, this.y, mouseX, mouseY);
                    if (distMouse < 90 && this.boldness > 0.6 && Math.random() < 0.4) {
                        this.state = "follow_mouse";
                        this.stateTimer = 100;
                        return;
                    }
                    // смена на отдых если энергия низкая
                    if (this.energy < 0.4 && Math.random() < 0.2) {
                        this.state = "rest";
                        this.stateTimer = 140;
                        return;
                    }
                    // иначе блуждание
                    this.state = "wander";
                    this.stateTimer = random(40, 150);
                }
            }
            
            // Профессиональная отрисовка кота (анатомия, тени, детали)
            draw(ctx, mouseGlobalX, mouseGlobalY) {
                ctx.save();
                ctx.shadowBlur = 6;
                ctx.shadowColor = "rgba(0,0,0,0.25)";
                // тело (овал)
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size*0.85, this.size*0.75, 0, 0, Math.PI*2);
                ctx.fillStyle = this.fur;
                ctx.fill();
                ctx.strokeStyle = "#764e2a";
                ctx.lineWidth = 1.2;
                ctx.stroke();
                // грудка
                ctx.beginPath();
                ctx.ellipse(this.x - 4, this.y + 6, 12, 10, 0, 0, Math.PI*2);
                ctx.fillStyle = this.secondFur;
                ctx.fill();
                // уши
                ctx.fillStyle = this.fur;
                ctx.beginPath();
                ctx.moveTo(this.x - 21, this.y - 18);
                ctx.lineTo(this.x - 8, this.y - 32);
                ctx.lineTo(this.x + 2, this.y - 20);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(this.x + 21, this.y - 18);
                ctx.lineTo(this.x + 8, this.y - 32);
                ctx.lineTo(this.x - 2, this.y - 20);
                ctx.fill();
                // внутренние уши
                ctx.fillStyle = "#f3bc9c";
                ctx.beginPath();
                ctx.moveTo(this.x - 16, this.y - 21);
                ctx.lineTo(this.x - 9, this.y - 29);
                ctx.lineTo(this.x - 4, this.y - 22);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(this.x + 16, this.y - 21);
                ctx.lineTo(this.x + 9, this.y - 29);
                ctx.lineTo(this.x + 4, this.y - 22);
                ctx.fill();
                
                // глаза с умным взглядом (следят за курсором)
                const angleToMouse = Math.atan2(mouseGlobalY - this.y, mouseGlobalX - this.x);
                const pupilOffsetX = Math.cos(angleToMouse) * 3.5;
                const pupilOffsetY = Math.sin(angleToMouse) * 2.8;
                ctx.fillStyle = "#fffdf0";
                ctx.beginPath();
                ctx.ellipse(this.x - 11, this.y - 4, 6, (this.blink ? 1.5 : 7), 0, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.x + 11, this.y - 4, 6, (this.blink ? 1.5 : 7), 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = this.eyeColor;
                ctx.beginPath();
                ctx.arc(this.x - 11 + pupilOffsetX*0.7, this.y - 4 + pupilOffsetY*0.7, 3.2, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 11 + pupilOffsetX*0.7, this.y - 4 + pupilOffsetY*0.7, 3.2, 0, Math.PI*2);
                ctx.fill();
                // блики
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(this.x - 14, this.y - 7, 1.5, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 8, this.y - 7, 1.5, 0, Math.PI*2);
                ctx.fill();
                
                // носик и рот
                ctx.fillStyle = "#ff8d85";
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + 4);
                ctx.lineTo(this.x - 3, this.y + 10);
                ctx.lineTo(this.x + 3, this.y + 10);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(this.x - 6, this.y + 8);
                ctx.quadraticCurveTo(this.x, this.y + 13, this.x + 6, this.y + 8);
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // усы (длинные)
                ctx.beginPath();
                ctx.moveTo(this.x - 14, this.y + 2);
                ctx.lineTo(this.x - 32, this.y - 2);
                ctx.moveTo(this.x - 13, this.y + 7);
                ctx.lineTo(this.x - 31, this.y + 9);
                ctx.moveTo(this.x + 14, this.y + 2);
                ctx.lineTo(this.x + 32, this.y - 2);
                ctx.moveTo(this.x + 13, this.y + 7);
                ctx.lineTo(this.x + 31, this.y + 9);
                ctx.stroke();
                
                // хвост (живой, с волнообразной анимацией)
                ctx.beginPath();
                ctx.moveTo(this.x - this.size*0.75, this.y + this.size*0.25);
                const tailOffset = this.tailWag * 8;
                ctx.quadraticCurveTo(this.x - this.size*0.9 - tailOffset*0.5, this.y + this.size*0.45 + tailOffset,
                                     this.x - this.size*1.2 + tailOffset, this.y + this.size*0.15 + tailOffset*0.7);
                ctx.lineWidth = 12;
                ctx.lineCap = "round";
                ctx.strokeStyle = this.fur;
                ctx.stroke();
                ctx.restore();
            }
        }
        
        // ----- СОЗДАНИЕ ОКРУЖЕНИЯ -----
        function initSimulation() {
            cats = [];
            yarnBalls = [];
            // стартовые 3 кота с разными характерами
            const personalities = [
                {activity: 1.2, curiosity: 1.5, boldness: 1.3},   // шалун
                {activity: 0.7, curiosity: 0.9, boldness: 0.6},    // ленивый
                {activity: 1.1, curiosity: 1.1, boldness: 1.0}     // уравновешенный
            ];
            for (let i = 0; i < 3; i++) {
                let x = random(room.left + 50, room.right - 50);
                let y = random(room.top + 50, room.bottom - 50);
                cats.push(new SmartCat(i, x, y, personalities[i]));
            }
            // клубки
            for (let i = 0; i < 3; i++) {
                yarnBalls.push(new YarnBall(random(room.left + 40, room.right - 40), random(room.top + 40, room.bottom - 40)));
            }
        }
        
        // отрисовка фона комнаты (красивый интерьер)
        function drawRoomBackground() {
            ctx.fillStyle = "#efdbc1";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // паркет
            for (let i = 0; i < canvas.width + 50; i += 55) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 20, canvas.height);
                ctx.lineTo(i - 20, canvas.height);
                ctx.fillStyle = "#dbbc8c";
                ctx.fill();
                ctx.strokeStyle = "#c1a06e";
                ctx.stroke();
            }
            // ковер
            ctx.fillStyle = "#b9804bc9";
            ctx.shadowBlur = 10;
            ctx.fillRect(room.left - 18, room.bottom - 85, room.right - room.left + 36, 70);
            ctx.fillStyle = "#d8985c";
            ctx.fillRect(room.left - 12, room.bottom - 78, room.right - room.left + 24, 60);
            ctx.fillStyle = "#f0bc7c";
            for(let i=0; i<18; i++) ctx.fillRect(room.left - 6 + i*((room.right-room.left+16)/18), room.bottom-18, 8, 14);
            ctx.shadowBlur = 0;
            // окно
            ctx.fillStyle = "#8fc5e8";
            ctx.fillRect(40, 35, 150, 110);
            ctx.fillStyle = "#ffeac2";
            ctx.fillRect(48, 43, 134, 94);
            ctx.fillStyle = "#ab7e54";
            ctx.fillRect(112, 43, 12, 94);
            ctx.fillRect(48, 86, 134, 12);
            // облака
            ctx.fillStyle = "#ffffe8";
            ctx.beginPath();
            ctx.ellipse(80, 70, 17, 14, 0, 0, Math.PI*2);
            ctx.ellipse(105, 62, 22, 16, 0, 0, Math.PI*2);
            ctx.ellipse(128, 70, 16, 13, 0, 0, Math.PI*2);
            ctx.fill();
        }
        
        // ----- ГЛАВНЫЙ ЦИКЛ -----
        let lastTimestamp = 0;
        function gameLoop() {
            // обновляем позицию мыши (глобальные координаты внутри canvas)
            // mouseX,mouseY уже обновляются через событие
            // обновление логики
            for (let cat of cats) cat.update(cats, yarnBalls, mouseX, mouseY);
            for (let yarn of yarnBalls) yarn.update();
            
            // отрисовка
            drawRoomBackground();
            for (let yarn of yarnBalls) yarn.draw();
            for (let cat of cats) cat.draw(ctx, mouseX, mouseY);
            
            // обновляем UI
            document.getElementById('catCount').innerText = cats.length;
            document.getElementById('yarnCount').innerText = yarnBalls.length;
            const avgActivity = cats.reduce((sum, c) => sum + c.activity, 0) / cats.length;
            document.getElementById('activityLevel').innerText = Math.floor(avgActivity * 80 + 20) + "%";
            frames++;
            requestAnimationFrame(gameLoop);
        }
        
        // обработка мыши (для взаимодействия и слежения зрачков)
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let canvasX = (e.clientX - rect.left) * scaleX;
            let canvasY = (e.clientY - rect.top) * scaleY;
            canvasX = clamp(canvasX, room.left, room.right);
            canvasY = clamp(canvasY, room.top, room.bottom);
            mouseX = canvasX;
            mouseY = canvasY;
        }
        
        function addNewCat() {
            if (cats.length < 10) {
                const x = random(room.left + 50, room.right - 50);
                const y = random(room.top + 50, room.bottom - 50);
                const newPersonality = {
                    activity: random(0.5, 1.5),
                    curiosity: random(0.4, 1.6),
                    boldness: random(0.3, 1.4)
                };
                cats.push(new SmartCat(cats.length, x, y, newPersonality));
            }
        }
        
        function addYarn() {
            if (yarnBalls.length < 8) {
                yarnBalls.push(new YarnBall(random(room.left + 40, room.right - 40), random(room.top + 40, room.bottom - 40)));
                document.getElementById('yarnCount').innerText = yarnBalls.length;
            }
        }
        
        canvas.addEventListener('mousemove', handleMouseMove);
        document.getElementById('spawnCatBtn').addEventListener('click', addNewCat);
        // двойной клик добавляет клубок
        canvas.addEventListener('dblclick', addYarn);
        
        initSimulation();
        gameLoop();
    })();
</script>
</body>
