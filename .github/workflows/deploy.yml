name: Docker Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mysite:latest .

      - name: Restart container
        run: |
          # Останавливаем и удаляем старый контейнер, если он существует
          docker stop mysite-container 2>/dev/null || true
          docker rm mysite-container 2>/dev/null || true
          # Запускаем новый в фоне
          docker run -d --name mysite-container -p 80:80 mysite:latest
          # Показываем, что контейнер запущен
          docker ps
