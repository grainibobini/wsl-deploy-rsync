name: Deploy to local Nginx

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted          # ← только так!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files directly
        run: |
          # Создаём папку, если её нет (на всякий случай)
          mkdir -p /var/www/mysite

          # Копируем все файлы из репозитория (точка) в /var/www/mysite
          # rsync здесь будет работать локально, без SSH
          rsync -avzr --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ /var/www/mysite/

          # Проверим, что файлы попали на место
          ls -la /var/www/mysite/
